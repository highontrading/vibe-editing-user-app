# Render Blueprint: deploys the whole stack from this repo in one go.
# Render dashboard -> New -> Blueprint -> pick this repository.
# Storage lives in a Cloudflare R2 bucket (set the S3_* variables when prompted).
services:
  - type: web
    name: vibe-web
    runtime: docker
    dockerfilePath: ./Dockerfile.web
    dockerContext: .
    plan: starter
    region: oregon
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: vibe-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: vibe-redis
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: APP_URL
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: PEXELS_API_KEY
        sync: false

  - type: worker
    name: vibe-worker
    runtime: docker
    dockerfilePath: ./Dockerfile.worker
    dockerContext: .
    plan: standard
    region: oregon
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: WORKER_CONCURRENCY
        value: "2"
      - key: RENDER_CONCURRENCY
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: vibe-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: vibe-redis
          property: connectionString
      - key: APP_URL
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: PEXELS_API_KEY
        sync: false

  - type: keyvalue
    name: vibe-redis
    plan: free
    region: oregon
    ipAllowList: []

databases:
  - name: vibe-db
    plan: basic-256mb
    region: oregon
